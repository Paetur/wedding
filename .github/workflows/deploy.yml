name: Deploy RSVP
run-name: Deploy RSVP ${{ inputs.release_tag }}
on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: Published RSVP-Manager version tag
        required: true
        default: v0.9.0-beta.6
        type: string
permissions:
  contents: read
concurrency:
  group: github-pages
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Verify full CI and the selected release
        env:
          RELEASE_TAG: ${{ inputs.release_tag }}
          RSVP_SUPABASE_URL: ${{ vars.RSVP_SUPABASE_URL }}
          RSVP_PUBLISHABLE_KEY: ${{ vars.RSVP_PUBLISHABLE_KEY }}
        run: python3 build-pages.py --tag "$RELEASE_TAG" --output _site
      - name: Upload website
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site
  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.publish.outputs.page_url }}
    steps:
      - name: Publish Pages
        id: publish
        uses: actions/deploy-pages@v4
